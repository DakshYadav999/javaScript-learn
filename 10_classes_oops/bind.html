<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React</title>
</head>
<body>
    <button>Button Clicked</button>

    <script>
        class React {
            constructor() {
                this.library = "React";
                this.server = "https://localhost:3000";

                // Requirement
                document
                    .querySelector("button")
                    .addEventListener("click", this.handleClick.bind(this));
            }

            handleClick() {
                console.log("Button clicked");
                console.log(this);
            }
        }

        // Create an object so the constructor runs
        const app = new React();
    </script>
</body>
</html>
